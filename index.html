<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Lompat Hewan Tak Terbatas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1a2a">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:#000; color:#fff; font-family:system-ui, sans-serif; user-select:none; touch-action:none; }
  canvas { position:fixed; left:0; top:0; width:100%; height:100%; display:block; }
  #hud { position:fixed; top:52px; left:8px; right:8px; display:flex; justify-content:space-between; gap:6px; font-size:13px; font-weight:700; pointer-events:none; }
  #hud span { background:rgba(0,0,0,.4); padding:5px 9px; border-radius:8px; }
  #btnSuara { position:fixed; top:8px; right:8px; z-index:5; padding:8px 12px; font-size:18px; }
  .layar { position:fixed; inset:0; background:rgba(5,10,25,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:16px; overflow-y:auto; z-index:3; }
  .sembunyi { display:none; }
  h1 { font-size:22px; margin:6px 0; color:#ffd166; text-align:center; }
  h2 { font-size:15px; margin:10px 0 4px; color:#8ff0e6; }
  .kecil { font-size:13px; color:#bcd6e0; text-align:center; max-width:420px; margin:4px 0; line-height:1.5; }
  .pilih { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(94vw,420px); }
  .pilih button { background:#2d3e55; font-size:14px; padding:10px 6px; }
  button { padding:11px 14px; border:none; border-radius:10px; background:#1fb5a8; color:#fff; font-size:15px; font-weight:700; }
  button.aktif { outline:3px solid #ffd166; }
  #mulai, #ulang { width:min(90vw,320px); font-size:17px; margin-top:6px; }
</style>
</head>
<body>
<canvas id="layarGame"></canvas>
<div id="hud" class="sembunyi">
  <span id="hJarak">Jarak 0 m</span>
  <span id="hLevel">Level 1</span>
  <span id="hKec">Kecepatan 0 km/j</span>
</div>
<button id="btnSuara">🔊</button>

<div id="menu" class="layar">
  <h1>Lompat Hewan Tak Terbatas</h1>
  <p class="kecil">Ketuk layar atau tekan Spasi untuk melompat. Jalur tidak pernah berakhir, dan kecepatan terus bertambah.</p>
  <h2>Pilih hewan</h2>
  <div class="pilih" id="pilihHewan"></div>
  <p class="kecil" id="ketHewan"></p>
  <h2>Pilih latar</h2>
  <div class="pilih" id="pilihLatar"></div>
  <button id="mulai">Mulai berlari</button>
  <p class="kecil">🎵 Ketuk layar sekali untuk memulai suara latar.</p>
</div>

<div id="akhir" class="layar sembunyi">
  <h1>Terjatuh!</h1>
  <p class="kecil" id="ringkasan"></p>
  <button id="ulang">Main lagi</button>
  <button class="sekunder" id="kembaliMenu" style="background:#2d3e55">Ganti hewan atau latar</button>
</div>

<script>
// ===== PENGATURAN DASAR (satuan asli, dikali skala layar) =====
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const GRAVITASI = 2600;
const KECEPATAN_LOMPAT = 1000;
const TINGGI_LOMPAT = (KECEPATAN_LOMPAT * KECEPATAN_LOMPAT) / (2 * GRAVITASI);
const KECEPATAN_DASAR = 260;
const PERCEPATAN = 6;            // kecepatan bertambah setiap detik, tanpa batas
const METER_PER_LEVEL = 500;

// ===== DATA HEWAN (desain sendiri, tidak meniru karakter hak cipta) =====
const HEWAN = [
  { id:'bebek',   nama:'Bebek',   ket:'Ringan dan lincah. Lompatannya sedang.', lompat:1.00 },
  { id:'ayam',    nama:'Ayam',    ket:'Ayunan sayapnya kuat, tapi lompatannya sedikit lebih pendek.', lompat:0.96 },
  { id:'tupai',   nama:'Tupai',   ket:'Gesit dan cepat. Ekornya besar.', lompat:1.06 },
  { id:'musang',  nama:'Musang',  ket:'Pelari licin dengan lompatan seimbang.', lompat:1.02 },
  { id:'kanguru', nama:'Kanguru', ket:'Kakinya kuat. Lompatannya paling tinggi.', lompat:1.14 }
];

// ===== DATA LATAR =====
const LATAR = [
  { id:'akuarium', nama:'Akuarium',          langit:['#1a8fbf','#063c63'], tanah:'#d8c07a', tanahGelap:'#a9914f' },
  { id:'padang',   nama:'Padang Pasir',      langit:['#ffd27f','#f08a5d'], tanah:'#e6b36a', tanahGelap:'#b5813e' },
  { id:'malam',    nama:'Malam Pegunungan',  langit:['#0b0f2a','#262b64'], tanah:'#2e4a33', tanahGelap:'#1d3020' },
  { id:'hujan',    nama:'Hujan',             langit:['#56616e','#2a313b'], tanah:'#3d4752', tanahGelap:'#2a323b' },
  { id:'salju',    nama:'Salju',             langit:['#e4eef8','#9fbcd8'], tanah:'#f4f8fc', tanahGelap:'#c9d9e8' }
];

// ===== FUNGSI MURNI (bisa diuji) =====
function kecepatanDasar(detik) { return KECEPATAN_DASAR + PERCEPATAN * detik; }   // satuan asli
function levelDari(meter) { return Math.floor(meter / METER_PER_LEVEL) + 1; }
function kmPerJam(kecepatanAsli) { return Math.round(kecepatanAsli * 0.2); }

const JENIS_RINTANGAN = ['batu', 'gentong', 'kayu', 'roda', 'besi'];
function buatRintangan(x, k, acak) {
  const jenis = JENIS_RINTANGAN[Math.floor(acak() * JENIS_RINTANGAN.length)];
  const susun = 2 + Math.floor(acak() * 2);     // tumpukan 2 atau 3
  let w, h;
  switch (jenis) {
    case 'batu':    w = 44 * k; h = 38 * k; break;
    case 'gentong': w = 50 * k; h = 50 * k; break;
    case 'kayu':    w = 56 * k; h = susun * 26 * k; break;
    case 'roda':    w = 48 * k; h = susun * 34 * k; break;
    case 'besi':    w = 52 * k; h = susun * 30 * k; break;
  }
  return { jenis, x, w, h, susun, sudut: 0 };
}

function jarakAntarRintangan(kecepatanSkala, k, acak) {
  return (220 + acak() * 180) * k + kecepatanSkala * 0.55;
}

function bertabrak(px, py, pw, ph, o, k, tanah) {
  const oy = tanah - o.h;
  const m = 7 * k;
  return px + m < o.x + o.w - m && px + pw - m > o.x + m &&
         py + m < oy + o.h && py + ph - m > oy;
}

function acakBenih(benih) {
  let s = (benih >>> 0) || 1;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
}

// ===== KANVAS DAN UKURAN =====
const cv = document.getElementById('layarGame');
const ctx = cv.getContext('2d');
let W = 0, H = 0, K = 1, TANAH = 0;
function ukuran() {
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  K = H / 640;
  TANAH = H * 0.8;
}
window.addEventListener('resize', ukuran);
ukuran();

// ===== STATUS =====
let mode = 'menu';
let hewanPilih = HEWAN[0], latarPilih = LATAR[0];
let waktu = 0, dist = 0, hgt = 0, vH = 0, scroll = 0;
let rintangan = [], jarakSpawn = 0, nextGap = 0;
let partikel = [];
let acakRun = acakBenih(1);
let skorTerbaik = Number(localStorage.getItem('lompat_terbaik') || 0);

// ===== SUARA (dibuat dengan kode) =====
let suaraOn = (localStorage.getItem('lompat_suara') || '1') === '1';
let actx = null, master = null, noiseBuf = null;
let suaraNodes = [], suaraTimers = [];

function pastikanAudio() {
  if (actx) { if (actx.state === 'suspended' && suaraOn) actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = suaraOn ? 0.5 : 0;
    master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    mulaiLatarSuara(latarPilih.id);
  } catch (e) { actx = null; }
}

function bunyiNada(frek, waktuMulai, durasi, tipe, vol, akhirFrek) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = tipe;
  o.frequency.setValueAtTime(frek, waktuMulai);
  if (akhirFrek) o.frequency.exponentialRampToValueAtTime(akhirFrek, waktuMulai + durasi);
  g.gain.setValueAtTime(0.0001, waktuMulai);
  g.gain.exponentialRampToValueAtTime(vol, waktuMulai + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, waktuMulai + durasi);
  o.connect(g); g.connect(master);
  o.start(waktuMulai); o.stop(waktuMulai + durasi + 0.05);
}

function bunyiDerau(frekFilter, tipeFilter, vol, durasi) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = tipeFilter; f.frequency.value = frekFilter;
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + durasi);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(); s.stop(actx.currentTime + durasi + 0.05);
}

function suaraLompat() { if (actx && suaraOn) bunyiNada(300, actx.currentTime, 0.18, 'square', 0.12, 720); }
function suaraJatuh() { if (actx && suaraOn) bunyiDerau(900, 'lowpass', 0.5, 0.35); }

function hentikanLatarSuara() {
  suaraTimers.forEach(clearInterval); suaraTimers = [];
  suaraNodes.forEach(n => { try { n.stop(); } catch (e) {} }); suaraNodes = [];
}

// Setiap latar punya suara sendiri
function mulaiLatarSuara(id) {
  if (!actx) return;
  hentikanLatarSuara();
  const t0 = actx.currentTime;
  const lanjut = (n) => { suaraNodes.push(n); return n; };
  const addLoop = (type, frek, vol) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = frek; g.gain.value = vol;
    o.connect(g); g.connect(master); o.start(t0);
    lanjut(o); return g;
  };
  const addRain = (filterType, frek, vol) => {
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true; f.type = filterType; f.frequency.value = frek;
    g.gain.value = vol; s.connect(f); f.connect(g); g.connect(master); s.start(t0);
    lanjut(s); return g;
  };
  if (id === 'akuarium') {
    addLoop('sine', 110, 0.05);
    suaraTimers.push(setInterval(() => {
      if (!suaraOn || !actx) return;
      const f = 600 + Math.random() * 600;
      bunyiNada(f, actx.currentTime, 0.12, 'sine', 0.05, f * 1.6);
    }, 500));
  } else if (id === 'padang') {
    const g = addRain('bandpass', 500, 0.08);
    const lfo = actx.createOscillator(), lg = actx.createGain();
    lfo.frequency.value = 0.15; lg.gain.value = 0.05;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(t0); lanjut(lfo);
  } else if (id === 'malam') {
    addRain('lowpass', 220, 0.04);
    suaraTimers.push(setInterval(() => {
      if (!suaraOn || !actx) return;
      const n = Math.floor(Math.random() * 3) + 1;
      for (let i = 0; i < n; i++) bunyiNada(3800 + Math.random() * 400, actx.currentTime + i * 0.09, 0.05, 'square', 0.012, null);
    }, 1200));
  } else if (id === 'hujan') {
    addRain('highpass', 1400, 0.06);
    suaraTimers.push(setInterval(() => {
      if (!suaraOn || !actx || Math.random() > 0.35) return;
      bunyiDerau(120, 'lowpass', 0.9, 2.2);
    }, 6000));
  } else if (id === 'salju') {
    addRain('lowpass', 400, 0.04);
    const nadaSalju = [523, 587, 659, 784, 880];
    suaraTimers.push(setInterval(() => {
      if (!suaraOn || !actx) return;
      const f = nadaSalju[Math.floor(Math.random() * nadaSalju.length)];
      bunyiNada(f, actx.currentTime, 1.6, 'sine', 0.05, null);
    }, 1800));
  }
}

// ===== PARTIKEL LATAR =====
function isiPartikel(id) {
  partikel = [];
  const n = id === 'akuarium' ? 30 : id === 'hujan' ? 80 : id === 'salju' ? 70 : id === 'padang' ? 40 : 0;
  for (let i = 0; i < n; i++) {
    const p = { x: Math.random() * W, y: Math.random() * H };
    if (id === 'akuarium') { p.vx = 0; p.vy = -(40 + Math.random() * 60) * K; p.r = (2 + Math.random() * 3) * K; }
    if (id === 'hujan')    { p.vx = -90 * K; p.vy = (700 + Math.random() * 200) * K; p.r = 1; }
    if (id === 'salju')    { p.vx = (Math.random() - 0.5) * 40 * K; p.vy = (50 + Math.random() * 60) * K; p.r = (1.5 + Math.random() * 2) * K; }
    if (id === 'padang')   { p.vx = -(200 + Math.random() * 120) * K; p.vy = 0; p.r = 1.2 * K; }
    partikel.push(p);
  }
  // bintang untuk malam
  if (id === 'malam') {
    partikel = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H * 0.6, r: (0.6 + Math.random() * 1.2) * K, ph: Math.random() * 6 }));
  }
}

function perbaruiPartikel(dt) {
  for (const p of partikel) {
    if (p.vx !== undefined) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y > H + 20 || p.y < -20) { p.y = p.vy > 0 ? -10 : H + 10; p.x = Math.random() * W; }
      if (p.x < -40) p.x = W + 20;
    }
  }
}

// ===== GAMBAR LATAR =====
function gambarLatar(l) {
  const g = ctx.createLinearGradient(0, 0, 0, TANAH);
  g.addColorStop(0, l.langit[0]); g.addColorStop(1, l.langit[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (l.id === 'akuarium') {
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (let i = 0; i < 5; i++) {
      const x = ((i * 0.23 * W) + Math.sin(waktu * 0.3 + i) * 30) % W;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 80 * K, 0); ctx.lineTo(x + 200 * K, TANAH); ctx.lineTo(x + 120 * K, TANAH); ctx.fill();
    }
  } else if (l.id === 'padang') {
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath(); ctx.arc(W * 0.8, H * 0.18, 42 * K, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9a25a';
    for (let L = 0; L < 2; L++) {
      ctx.beginPath(); ctx.moveTo(0, TANAH);
      for (let x = 0; x <= W; x += 10) {
        ctx.lineTo(x, TANAH - (40 + L * 30) * K - Math.sin((x + scroll * (0.3 + L * 0.2)) * 0.01) * (30 + L * 10) * K);
      }
      ctx.lineTo(W, TANAH); ctx.fill();
    }
  } else if (l.id === 'malam') {
    for (const s of partikel) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(waktu * 2 + s.ph);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f7f1d0';
    ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 26 * K, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b2350';
    for (let L = 0; L < 2; L++) {
      ctx.beginPath(); ctx.moveTo(0, TANAH);
      for (let x = 0; x <= W; x += 10) {
        ctx.lineTo(x, TANAH - (90 + L * 50) * K - Math.abs(Math.sin((x + scroll * (0.2 + L * 0.15)) * 0.008)) * (120 + L * 40) * K);
      }
      ctx.lineTo(W, TANAH); ctx.fill();
    }
  } else if (l.id === 'hujan') {
    ctx.fillStyle = '#343c46';
    for (let i = 0; i < 6; i++) {
      const x = ((i * 0.22 * W) - scroll * 0.2) % (W + 200 * K) - 100 * K;
      ctx.beginPath(); ctx.ellipse(x, 60 * K + (i % 2) * 30 * K, 120 * K, 40 * K, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(200,220,255,.45)'; ctx.lineWidth = 1.2 * K;
    for (const p of partikel) {
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.vx * 0.02, p.y + 14 * K); ctx.stroke();
    }
  } else if (l.id === 'salju') {
    ctx.fillStyle = '#ffffff';
    for (let L = 0; L < 2; L++) {
      ctx.beginPath(); ctx.moveTo(0, TANAH);
      for (let x = 0; x <= W; x += 10) {
        ctx.lineTo(x, TANAH - (70 + L * 30) * K - Math.sin((x + scroll * (0.25 + L * 0.1)) * 0.012) * 40 * K);
      }
      ctx.lineTo(W, TANAH); ctx.fill();
    }
  }

  // partikel yang dianimasikan
  if (l.id === 'akuarium') {
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (const p of partikel) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  } else if (l.id === 'salju') {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    for (const p of partikel) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  } else if (l.id === 'padang') {
    ctx.fillStyle = 'rgba(255,240,200,.6)';
    for (const p of partikel) { ctx.fillRect(p.x, p.y, p.r * 2, p.r * 2); }
  }
}

function gambarTanah(l) {
  ctx.fillStyle = l.tanah; ctx.fillRect(0, TANAH, W, H - TANAH);
  ctx.fillStyle = l.tanahGelap; ctx.fillRect(0, TANAH, W, 6 * K);
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  for (let i = 0; i < 12; i++) {
    const x = ((i * 130 * K - scroll) % (W + 130 * K) + W + 130 * K) % (W + 130 * K) - 60 * K;
    ctx.fillRect(x, TANAH + 20 * K + (i % 3) * 14 * K, 40 * K, 4 * K);
  }
}

// ===== GAMBAR RINTANGAN =====
function gambarRintangan(o) {
  const y = TANAH - o.h;
  ctx.save();
  if (o.jenis === 'batu') {
    ctx.fillStyle = '#7d7f86';
    ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, TANAH - o.h / 2, o.w / 2, o.h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.ellipse(o.x + o.w * 0.4, TANAH - o.h * 0.7, o.w * 0.15, o.h * 0.15, 0, 0, Math.PI * 2); ctx.fill();
  } else if (o.jenis === 'gentong') {
    const r = o.w / 2;
    ctx.translate(o.x + r, TANAH - r); ctx.rotate(o.sudut);
    ctx.fillStyle = '#9a5b2e'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5c3218'; ctx.lineWidth = 3 * K;
    for (let i = 0; i < 4; i++) {
      const a = (i * Math.PI) / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); ctx.stroke();
    }
  } else if (o.jenis === 'kayu') {
    for (let i = 0; i < o.susun; i++) {
      const py = TANAH - (i + 1) * 26 * K;
      ctx.fillStyle = i % 2 ? '#b07a3e' : '#9a6a33';
      ctx.fillRect(o.x, py, o.w, 24 * K);
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(o.x + 6 * K, py + 8 * K, o.w - 12 * K, 2 * K);
    }
  } else if (o.jenis === 'roda') {
    for (let i = 0; i < o.susun; i++) {
      const cy = TANAH - (i * 34 + 17) * K;
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(o.x + o.w / 2, cy, 17 * K, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#777';
      ctx.beginPath(); ctx.arc(o.x + o.w / 2, cy, 7 * K, 0, Math.PI * 2); ctx.fill();
    }
  } else if (o.jenis === 'besi') {
    for (let i = 0; i < o.susun; i++) {
      const py = TANAH - (i + 1) * 30 * K;
      ctx.fillStyle = i % 2 ? '#6f7379' : '#5b5f66';
      ctx.fillRect(o.x, py, o.w, 27 * K);
      ctx.fillStyle = 'rgba(160,80,30,.5)';
      ctx.beginPath(); ctx.arc(o.x + o.w * 0.3, py + 12 * K, 4 * K, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.x + o.w * 0.7, py + 18 * K, 3 * K, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

// ===== GAMBAR HEWAN (bentuk sederhana, berbeda untuk tiap hewan) =====
function gambarHewan(h, x, bawah, t, diudara) {
  const s = K;
  const kaki = diudara ? 0 : Math.sin(t * 0.025) * 7 * s;
  ctx.save();
  ctx.lineWidth = 3 * s; ctx.lineCap = 'round';

  // ekor dan elemen di belakang
  if (h.id === 'tupai') {
    ctx.fillStyle = '#7a4a22';
    ctx.beginPath(); ctx.ellipse(x + 4 * s, bawah - 34 * s, 14 * s, 26 * s, -0.4, 0, Math.PI * 2); ctx.fill();
  } else if (h.id === 'musang') {
    ctx.strokeStyle = '#5f646b'; ctx.lineWidth = 9 * s;
    ctx.beginPath(); ctx.moveTo(x + 8 * s, bawah - 30 * s); ctx.quadraticCurveTo(x - 14 * s, bawah - 34 * s, x - 8 * s, bawah - 52 * s); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(x + 2 * s, bawah - 34 * s); ctx.quadraticCurveTo(x - 8 * s, bawah - 36 * s, x - 8 * s, bawah - 48 * s); ctx.stroke();
  }

  // kaki
  ctx.strokeStyle = h.id === 'bebek' ? '#ff8c1a' : '#3a2a1a';
  if (h.id === 'kanguru') {
    ctx.lineWidth = 6 * s;
    ctx.beginPath(); ctx.moveTo(x + 18 * s, bawah - 16 * s); ctx.lineTo(x + 12 * s, bawah + kaki * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 28 * s, bawah - 16 * s); ctx.lineTo(x + 34 * s, bawah - kaki * 0.4); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(x + 18 * s, bawah - 14 * s); ctx.lineTo(x + 14 * s, bawah + kaki * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 28 * s, bawah - 14 * s); ctx.lineTo(x + 32 * s, bawah - kaki * 0.5); ctx.stroke();
  }

  // badan
  const warnaBadan = { bebek: '#ffd23f', ayam: '#ffffff', tupai: '#a0602c', musang: '#8b8f96', kanguru: '#c98b4e' }[h.id];
  ctx.fillStyle = warnaBadan;
  const tinggiBadan = h.id === 'kanguru' ? 24 : 20;
  ctx.beginPath(); ctx.ellipse(x + 22 * s, bawah - 26 * s, 20 * s, tinggiBadan * s, 0, 0, Math.PI * 2); ctx.fill();

  if (h.id === 'kanguru') {
    ctx.fillStyle = '#e7c39a';
    ctx.beginPath(); ctx.ellipse(x + 26 * s, bawah - 22 * s, 10 * s, 9 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (h.id === 'musang') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x + 30 * s, bawah - 36 * s, 6 * s, 3 * s, 0.5, 0, Math.PI * 2); ctx.fill();
  }
  // sayap
  if (h.id === 'bebek' || h.id === 'ayam') {
    ctx.fillStyle = h.id === 'bebek' ? '#e0a800' : '#e9e9e9';
    ctx.beginPath(); ctx.ellipse(x + 16 * s, bawah - 28 * s, 10 * s, 6 * s, diudara ? -0.6 : 0.2, 0, Math.PI * 2); ctx.fill();
  }

  // kepala
  ctx.fillStyle = warnaBadan;
  ctx.beginPath(); ctx.arc(x + 36 * s, bawah - 44 * s, 12 * s, 0, Math.PI * 2); ctx.fill();

  // paruh, jengger, mata
  if (h.id === 'bebek') {
    ctx.fillStyle = '#ff8c1a';
    ctx.beginPath(); ctx.ellipse(x + 50 * s, bawah - 42 * s, 8 * s, 4 * s, 0, 0, Math.PI * 2); ctx.fill();
  } else if (h.id === 'ayam') {
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(x + 34 * s, bawah - 56 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 39 * s, bawah - 56 * s, 4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffb703';
    ctx.beginPath(); ctx.moveTo(x + 46 * s, bawah - 46 * s); ctx.lineTo(x + 54 * s, bawah - 43 * s); ctx.lineTo(x + 46 * s, bawah - 40 * s); ctx.fill();
  } else if (h.id === 'tupai') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(x + 40 * s, bawah - 39 * s, 5 * s, 3 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffb703';
    ctx.beginPath(); ctx.arc(x + 44 * s, bawah - 37 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
  } else if (h.id === 'musang') {
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.moveTo(x + 46 * s, bawah - 46 * s); ctx.lineTo(x + 56 * s, bawah - 42 * s); ctx.lineTo(x + 46 * s, bawah - 39 * s); ctx.fill();
  } else if (h.id === 'kanguru') {
    ctx.fillStyle = '#7a4a22';
    ctx.beginPath(); ctx.moveTo(x + 46 * s, bawah - 46 * s); ctx.lineTo(x + 50 * s, bawah - 42 * s); ctx.lineTo(x + 46 * s, bawah - 40 * s); ctx.fill();
  }
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(x + 40 * s, bawah - 46 * s, 2 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ===== PERMAINAN =====
function resetPermainan() {
  waktu = 0; dist = 0; hgt = 0; vH = 0; scroll = 0;
  rintangan = []; jarakSpawn = 0; nextGap = 0;
  acakRun = acakBenih(Date.now() & 0xffff);
  isiPartikel(latarPilih.id);
}

function kecepatanSekarang() { return kecepatanDasar(waktu) * K; }

function lompat() {
  if (mode !== 'main' || hgt > 0.01) return;
  vH = KECEPATAN_LOMPAT * K * hewanPilih.lompat;
  suaraLompat();
}

function perbarui(dt) {
  if (mode !== 'main') return;
  waktu += dt;
  const v = kecepatanSekarang();
  dist += (v / K) * dt / 100;          // 100 satuan = 1 meter
  scroll += v * dt;

  // lompatan
  vH -= GRAVITASI * K * dt;
  hgt += vH * dt;
  if (hgt <= 0) { hgt = 0; vH = 0; }

  // rintangan baru
  jarakSpawn += v * dt;
  if (nextGap <= 0) nextGap = jarakAntarRintangan(v, K, acakRun);
  if (jarakSpawn >= nextGap) {
    rintangan.push(buatRintangan(W + 20 * K, K, acakRun));
    jarakSpawn = 0; nextGap = jarakAntarRintangan(v, K, acakRun);
  }
  for (const o of rintangan) {
    o.x -= v * dt;
    if (o.jenis === 'gentong') o.sudut += (v * dt) / (o.w / 2);
  }
  rintangan = rintangan.filter(o => o.x + o.w > -20 * K);

  // tabrakan
  const px = W * 0.18, pw = 44 * K, ph = 56 * K;
  const py = TANAH - hgt - ph;
  for (const o of rintangan) {
    if (bertabrak(px, py, pw, ph, o, K, TANAH)) { akhirPermainan(); return; }
  }

  perbaruiPartikel(dt);
  updateHUD();
}

function updateHUD() {
  document.getElementById('hJarak').textContent = 'Jarak ' + Math.floor(dist) + ' m';
  document.getElementById('hLevel').textContent = 'Level ' + levelDari(dist);
  document.getElementById('hKec').textContent = 'Kecepatan ' + kmPerJam(kecepatanSekarang() / K) + ' km/j';
}

function akhirPermainan() {
  mode = 'over';
  suaraJatuh();
  const m = Math.floor(dist);
  if (m > skorTerbaik) { skorTerbaik = m; localStorage.setItem('lompat_terbaik', String(m)); }
  document.getElementById('ringkasan').textContent =
    `${hewanPilih.nama} berlari ${m} meter, sampai level ${levelDari(dist)}. Kecepatan terakhir ${kmPerJam(kecepatanSekarang() / K)} km/j. Terbaik: ${skorTerbaik} meter.`;
  document.getElementById('hud').classList.add('sembunyi');
  document.getElementById('akhir').classList.remove('sembunyi');
}

function gambar() {
  const l = latarPilih;
  ctx.clearRect(0, 0, W, H);
  gambarLatar(l);
  gambarTanah(l);
  for (const o of rintangan) gambarRintangan(o);
  gambarHewan(hewanPilih, W * 0.18, TANAH - hgt, waktu * 1000, hgt > 0.5);
}

// ===== MENU =====
function tampilPilihan() {
  const hew = document.getElementById('pilihHewan');
  hew.innerHTML = '';
  HEWAN.forEach(h => {
    const b = document.createElement('button');
    b.textContent = h.nama;
    if (h.id === hewanPilih.id) b.classList.add('aktif');
    b.onclick = () => { hewanPilih = h; tampilPilihan(); };
    hew.appendChild(b);
  });
  document.getElementById('ketHewan').textContent = hewanPilih.ket;

  const lat = document.getElementById('pilihLatar');
  lat.innerHTML = '';
  LATAR.forEach(l => {
    const b = document.createElement('button');
    b.textContent = l.nama;
    if (l.id === latarPilih.id) b.classList.add('aktif');
    b.onclick = () => { latarPilih = l; tampilPilihan(); };
    lat.appendChild(b);
  });
}

function mulaiLari() {
  pastikanAudio();
  resetPermainan();
  mode = 'main';
  document.getElementById('menu').classList.add('sembunyi');
  document.getElementById('akhir').classList.add('sembunyi');
  document.getElementById('hud').classList.remove('sembunyi');
  if (actx) mulaiLatarSuara(latarPilih.id);
  updateHUD();
}

function kembaliMenu() {
  mode = 'menu';
  document.getElementById('akhir').classList.add('sembunyi');
  document.getElementById('hud').classList.add('sembunyi');
  document.getElementById('menu').classList.remove('sembunyi');
  tampilPilihan();
}

// ===== INPUT =====
document.getElementById('mulai').onclick = mulaiLari;
document.getElementById('ulang').onclick = mulaiLari;
document.getElementById('kembaliMenu').onclick = kembaliMenu;
document.getElementById('btnSuara').onclick = () => {
  suaraOn = !suaraOn;
  localStorage.setItem('lompat_suara', suaraOn ? '1' : '0');
  document.getElementById('btnSuara').textContent = suaraOn ? '🔊' : '🔇';
  if (master) master.gain.value = suaraOn ? 0.5 : 0;
};
document.addEventListener('pointerdown', e => {
  pastikanAudio();
  if (e.target.closest && e.target.closest('button')) return;
  lompat();
});
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); pastikanAudio(); lompat(); }
});

// ===== PERULANGAN UTAMA =====
let terakhir = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - terakhir) / 1000);
  terakhir = t;
  perbarui(dt);
  if (mode === 'main' || mode === 'over') gambar();
  else { gambar(); }
  requestAnimationFrame(frame);
}

document.getElementById('btnSuara').textContent = suaraOn ? '🔊' : '🔇';
tampilPilihan();
requestAnimationFrame(frame);
</script>
